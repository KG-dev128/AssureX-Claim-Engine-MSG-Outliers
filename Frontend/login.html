<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ClaimSure_AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/root.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    
    <nav class="navbar navbar-expand-lg fixed-top py-3">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fa-solid fa-shield-halved me-2"></i>ClaimSure_AI
            </a>
            <div class="ms-auto d-flex align-items-center">
                <a href="register.html" class="nav-link fw-bold text-muted">Create Account</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="light-card auth-card">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-dark">Welcome Back</h3>
                <p class="text-muted">Sign in to manage your warranty claims.</p>
            </div>
            <form action="claim.html">
                <div class="mb-3">
                    <label class="form-label fw-bold text-dark">Email Address</label>
                    <input type="email" class="form-control" placeholder="name@example.com" required>
                </div>
                <div class="mb-3">
                    <div class="d-flex justify-content-between">
                        <label class="form-label fw-bold text-dark">Password</label>
                        <a href="#" class="text-sage text-decoration-none small fw-bold">Forgot Password?</a>
                    </div>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label text-muted" for="rememberMe">Remember me</label>
                </div>
                <button type="submit" class="btn btn-olive w-100 mb-3">Login to Dashboard</button>
                
                <div class="text-center position-relative my-4">
                    <hr>
                    <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-muted small fw-bold">OR</span>
                </div>
                
                <button type="button" class="btn btn-outline-secondary w-100">
                    <i class="fa-brands fa-google me-2"></i> Continue with Google
                </button>
            </form>
        </div>
    </div>

</body>
</html>
