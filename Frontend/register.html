<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ClaimSure_AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/root.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top py-3">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fa-solid fa-shield-halved me-2"></i>ClaimSure_AI
            </a>
            <div class="ms-auto d-flex align-items-center">
                <a href="login.html" class="nav-link fw-bold text-muted">Already have an account? Login</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="light-card auth-card" style="max-width: 600px;">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-dark">Create an Account</h3>
                <p class="text-muted">Join ClaimSure_AI to experience zero-touch warranty validation.</p>
            </div>
            <form action="login.html">
                <div class="row g-3">
                    <div class="col-sm-6">
                        <label class="form-label fw-bold text-dark">Full Name</label>
                        <input type="text" class="form-control" placeholder="John Doe" required>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label fw-bold text-dark">Phone Number</label>
                        <input type="text" class="form-control" placeholder="+1 (555) 000-0000" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-bold text-dark">Email Address</label>
                        <input type="email" class="form-control" placeholder="name@example.com" required>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label fw-bold text-dark">Password</label>
                        <input type="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label fw-bold text-dark">Confirm Password</label>
                        <input type="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-bold text-dark">Account Type</label>
                        <select class="form-select" required>
                            <option value="user" selected>End User (Filing Claims)</option>
                            <option value="partner">Business Partner (Manufacturer/Retailer)</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <div class="form-check mt-2">
                            <input class="form-check-input" type="checkbox" id="termsCheck" required>
                            <label class="form-check-label text-muted" for="termsCheck">
                                I agree to the <a href="#" class="text-sage text-decoration-none fw-bold">Terms of Service</a> and <a href="#" class="text-sage text-decoration-none fw-bold">Privacy Policy</a>.
                            </label>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-olive w-100 mt-4">Create Account</button>
            </form>
        </div>
    </div>

</body>
</html>
